[metadata]
name = 'pyStarburst99'
version = "0.1.0"

model_folder = 'core/pySB99_files'

[metadata.metallicity]
MWC = 0.02
MW = 0.014
LMC = 0.006
SMC = 0.002
IZw18 = 0.0004
XMP = 0.00001
values.Z0 = 0.0

   # ---------------------------------------------------------------------------------------------------------------------
[default_settings]
star_formation_option = "ISF"               # ISF: instantaneous burst (uses M_total). CSF: continuous star formation (uses SFR)
track_choice = "GENEC"                      # GENEC or Pauli (Pauli+26, rotating at ~100 km/s). Parsec likely coming soon
rotation = false                                 # GENEC tracks with 0.4 v_critical rotation (true) or non-rotating (false)
SED_library = "FW"                          # Low-resolution OB library: FW (Fastwind), WM (WMbasic) or PoWR
spectra_library = "WM"                      # High-resolution OB library: WM (WMbasic) or PoWR (Potsdam). FW coming soon
mass_loss_rate_option = "DEFAULT"           # PoWR high-resolution Mdot: DEFAULT (Vd3). HIGH, MODERATE and LOW not implemented yet
input_imf_option = false                    # true: read a stochastically sampled IMF (list of stellar masses) from stochastic_imf_file
stochastic_imf_file = "chabrier_stars.npy"

# Outputs (results are always saved)
plot_results_check = true                   # Plot the results and save the figures in the output folder
output_age = 2.0                            # Myr, age of the example SED and high-resolution spectrum which are saved and plotted

# Grid parameters
M_total = 1.0e6                             # Msol, total mass of the burst (ISF)
SFR = 1.0                                   # Msol/yr, star formation rate (CSF)
IMF_exponents = [1.3, 2.3]
IMF_mass_limits = [0.1, 0.5, 120.0]
maximum_SN_mass = 120.0                     # Msol, maximum stellar initial mass accounted for as going supernova
time_step_length = 0.1e6                    # yr
run_speed_mode = "DEFAULT"                  # Isochrone mass interpolation: FAST (~20 s, tests and models < 10 Myr), DEFAULT (~60 s) or HIGH_RES

#log_intervals = false
#log_age_start = -inf                        # age 0 yr (only valid for linear intervals)
#log_age_end = 7.69897                       # 50 Myr
#log_age_step = 5.0                          # log10(step/yr): 0.1 Myr

