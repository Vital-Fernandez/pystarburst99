[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pystarburst99"
version = "0.1.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3.12",
               "Topic :: Scientific/Engineering :: Astronomy"]

authors = [{name = "Calum Hawcroft", email = "pystarburst99@gmail.com"}]
description = "Python stellar population synthesis code based on Starburst99"

dependencies = ["matplotlib>=3.10",
                "numpy>=2.0, <3",
                "pandas>=3.0, <4",
                "scipy>=1.18"]

[project.optional-dependencies]
full = ["tqdm>=4.66",
        "streamlit>=1.66.0",
        "bokeh>=3.10.1",
        "streamlit-bokeh>=3.10.1"]

docs = ["sphinx~=9.1.0",
        "sphinx-rtd-theme~=3.1",
        "myst-nb~=1.4"]

tests = ["pytest~=9.1.1",
         "pytest-cov~=7.1.0"]

[project.scripts]
pystarburst99 = "pystarburst99.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pystarburst99 = ["pystarburst99.toml",
                 "core/pySB99_files/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
source = ["pystarburst99"]